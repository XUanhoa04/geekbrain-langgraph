[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisrag"
version = "2.0.0"
description = "AegisRAG: governed multi-source intelligence on Amazon Bedrock and S3 Vectors"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.43.4",
  "langchain-aws>=1.4.6",
  "langchain-core>=1.3.3",
  "langgraph>=1.1.10",
  "pydantic>=2.12",
  "pydantic-settings>=2.12",
  "PyYAML>=6.0",
  "requests>=2.32",
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["geekbrain_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
